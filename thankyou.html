<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thank You | L'Amour</title><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet"><link href="https://fonts.cdnfonts.com/css/argesta-headline" rel="stylesheet"><style>:root {
            --primary: #e6cfa7;
            --dark: #181818;
            --accent: #bfa77a;
            --font-headline: 'Argesta Headline', 'Montserrat', serif;
            --font-body: 'Montserrat', sans-serif;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #040404;
            color: #fff;
            text-align: center;
            font-family: var(--font-body);
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .thank-you-container {
            max-width: 600px;
        }
        .thank-you-title {
            font-family: var(--font-headline);
            font-size: 3rem;
            margin-bottom: 1rem;
            font-weight: 400;
        }
        .thank-you-message {
            font-size: 1.2rem;
            line-height: 1.6;
            margin-bottom: 2.5rem;
        }
        .back-link {
            display: inline-block;
            padding: 0.8rem 2rem;
            background: var(--primary);
            color: var(--dark);
            text-decoration: none;
            font-weight: 700;
            border-radius: 16px;
            transition: background 0.2s;
        }
        .back-link:hover {
            background: var(--accent);
        }</style></head><body><div class="thank-you-container"><h1 class="thank-you-title">
        Thank You!</h1><p class="thank-you-message">
        Thanks for sharing your details! <br>Our course expert will contact you shortly, or you can talk to us by clicking the button below. </p>
        <a href="tel:+971562454699" class="back-link">Talk to us</a>
</div>
